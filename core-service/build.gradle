dependencies {
    implementation project(':libs:common')   // 공통 응답·에러 코드 계약, @LoginUser (ADR-0024)
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'   // 원장 반영 Stream consumer (ADR-0019)
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'   // JWT 발급(Nimbus) + 검증
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'   // Boot 4: @WebMvcTest 슬라이스에 보안 설정을 붙이는 모듈
    // 마이그레이션은 db-migration 모듈이 실행한다 (ADR-0024). 테스트에서만 Flyway 로 스키마를 만든다
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway'
    testImplementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
}

// 테스트 DB(Testcontainers) 스키마는 db-migration 의 SQL 로 만든다 — 마이그레이션 원본은 한 곳에만 둔다
tasks.named('processTestResources') {
    from(project(':db-migration').file('src/main/resources')) { include 'db/**' }
}
