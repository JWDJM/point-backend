spring:
  application:
    name: db-migration
  main:
    web-application-type: none   # 웹 서버 없이 마이그레이션만 하고 종료
  profiles:
    default: local          # K8s 에서는 SPRING_PROFILES_ACTIVE=aws / gcp-dr
  datasource:
    # 마이그레이션 전용 계정 (DDL 권한, point-infra #57). 서비스 계정에는 DDL 권한을 주지 않는다
    url: ${DB_URL:jdbc:postgresql://localhost:5432/point}
    username: ${DB_USERNAME:app_rw}
    password: ${DB_PASSWORD:app_rw}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 기존 환경의 public.flyway_schema_history 를 그대로 이어서 쓴다 (기본값 유지 — 바꾸면 처음부터 다시 적용하려 한다)
